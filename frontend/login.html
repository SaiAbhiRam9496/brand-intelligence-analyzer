<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Brand Intelligence Analyzer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="nav-bar">
                <a href="home.html" class="logo">BrandIntel<span class="logo-dot"></span></a>
                <nav>
                    <ul>
                        <li><a href="home.html">Home</a></li>
                        <li><a href="about.html">About</a></li>
                        <li><a href="register.html" class="btn btn-secondary">Sign Up</a></li>
                    </ul>
                </nav>
            </div>
        </header>

        <main class="auth-wrapper">
            <div class="card auth-card">
                <div class="auth-header">
                    <h2>Welcome Back</h2>
                    <p style="color: var(--text-secondary); font-size: 0.9rem; margin-top: 0.2rem;">
                        Log in to analyze your brand strategy
                    </p>
                </div>

                <div class="auth-error" id="authError"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem; padding: 0.8rem;">
                        Log In
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Sign Up</a>
                </div>
            </div>
        </main>

        <footer>
            &copy; 2026 Brand Intelligence Analyzer. All rights reserved.
        </footer>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Redirect dashboard if already logged in
        Auth.redirectIfAuthenticated();

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('authError');
            errorDiv.style.display = 'none';

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            try {
                const res = await API.login(user, pass);
                Auth.saveToken(res.token);
                window.location.href = 'dashboard.html';
            } catch (err) {
                errorDiv.textContent = err.message || "Failed to log in.";
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
